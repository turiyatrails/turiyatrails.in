<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turiya Trails | Finding True Meaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FCF9F5;
  --white: #FCF9F5;
  --forest: #2a5439;
  --forest-mid: #3a7050;
  --forest-light: #c8ddd0;
  --earth: #7a5c3a;
  --stone: #9b9188;
  --text: #1e1a16;
  --text-mid: #4a4540;
  --text-light: #7a7268;
  --gold: #b8872a;
  --gold-light: #d4a84a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:"Outfit",sans-serif; background:var(--cream); color:var(--text); font-weight:300; overflow-x:hidden; cursor:none; }

#cur { position:fixed;width:8px;height:8px;background:var(--forest);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%); }
#cur-r { position:fixed;width:32px;height:32px;border:1px solid var(--forest);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .18s ease;opacity:.4; }

nav { position:fixed;top:0;left:0;right:0;z-index:200;padding:24px 64px;display:flex;align-items:center;justify-content:space-between;transition:all .5s; }
nav.scrolled { background:rgba(244,240,234,0.96);backdrop-filter:blur(16px);padding:14px 64px;border-bottom:1px solid rgba(42,84,57,.08); }
.nav-logo { display:flex;align-items:center; }
.nav-logo img { height:44px;width:auto; }
.nav-links { display:flex;gap:36px;list-style:none; }
.nav-links a { font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mid);text-decoration:none;font-weight:400;opacity:.7;transition:opacity .3s; }
.nav-links a:hover { opacity:1; }
.nav-btn { padding:9px 26px;border:1px solid var(--forest);color:var(--forest)!important;opacity:1!important;border-radius:2px;transition:background .3s,color .3s!important; }
.nav-btn:hover { background:var(--forest)!important;color:var(--cream)!important; }

#hero { min-height:100vh;background:linear-gradient(rgba(252,249,245,0.85), rgba(252,249,245,0.88)), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:120px 64px 80px;position:relative;overflow:hidden; }
.hero-left { padding-right:64px; }
.hero-tag { display:inline-flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--forest);opacity:.75;margin-bottom:40px;animation:fadeUp 1s ease both; }
.hero-tag::before { display:none; }
.hero-h1 { font-family:"Cormorant Garamond",serif;font-size:clamp(52px,5.5vw,88px);font-weight:300;line-height:1.06;letter-spacing:-.01em;margin-bottom:28px;animation:fadeUp 1s .15s ease both; }
.hero-h1 em { font-style:italic;color:var(--forest); }
.hero-sub { font-size:16px;line-height:1.9;color:var(--text-light);max-width:420px;margin-bottom:48px;animation:fadeUp 1s .3s ease both; }
.hero-ctas { display:flex;gap:16px;flex-wrap:wrap;animation:fadeUp 1s .45s ease both; }
.btn-p { padding:14px 36px;background:var(--forest);color:var(--cream);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:background .3s,transform .2s; }
.btn-p:hover { background:#1a3d28;transform:translateY(-1px); }
.btn-o { padding:14px 36px;border:1px solid rgba(42,84,57,.3);color:var(--text-mid);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:border-color .3s,color .3s; }
.btn-o:hover { border-color:var(--forest);color:var(--forest); }
.hero-right { display:flex;align-items:center;justify-content:center;animation:fadeUp .8s .2s ease both; }
.hero-logo-ring { width:520px;height:520px;border:1px solid rgba(42,84,57,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(252,249,245,0.6);backdrop-filter:blur(4px); }
.hero-logo-ring::before { content:'';position:absolute;width:590px;height:590px;border:1px dashed rgba(42,84,57,.06);border-radius:50%;animation:spinSlow 40s linear infinite; }
.hero-logo-ring img { width:360px;height:auto; }
.hero-scroll { position:absolute;bottom:40px;left:64px;display:flex;align-items:center;gap:14px;animation:fadeUp 1s .8s ease both; }
.hero-scroll span { font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone); }
.scroll-track { width:40px;height:1px;background:var(--stone);position:relative;overflow:hidden; }
.scroll-fill { position:absolute;height:100%;width:100%;background:var(--forest);animation:scanRight 2.5s ease-in-out infinite; }

#stats { background:var(--forest);padding:32px 64px;display:flex;justify-content:space-between;align-items:center; }
.stat { text-align:center; }
.stat-n { font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:300;color:var(--cream);line-height:1;margin-bottom:6px; }
.stat-l { font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,240,234,.5); }
.stat-div { width:1px;height:48px;background:rgba(244,240,234,.15); }

.sec-label { font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--forest);opacity:.7;margin-bottom:18px;display:flex;align-items:center;gap:12px; }
.sec-label::before { content:'';width:20px;height:1px;background:currentColor; }
.sec-h2 { font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(34px,3.5vw,54px);line-height:1.18;color:var(--text);margin-bottom:28px; }
.sec-h2 em { font-style:italic;color:var(--forest); }

#about { background:var(--cream);padding:120px 64px; }
.about-wrap { max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1.1fr;gap:100px;align-items:center; }
.about-text p { font-size:16px;line-height:1.95;color:var(--text-light);margin-bottom:22px; }
.about-quote { background:var(--white);border-left:3px solid var(--forest);padding:44px 52px;border-radius:0 4px 4px 0;position:relative; }
.about-quote::before { content:'"';font-family:"Cormorant Garamond",serif;font-size:140px;line-height:1;color:var(--forest-light);position:absolute;top:-10px;left:28px;pointer-events:none; }
.about-quote p { font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:300;font-style:italic;line-height:1.6;color:var(--text);position:relative;z-index:1; }
.about-quote cite { display:block;font-family:"Outfit",sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);margin-top:20px;font-style:normal; }

#experiences { background:var(--white);padding:120px 64px; }
.exp-head { text-align:center;margin-bottom:72px; }
.exp-head .sec-label { justify-content:center; }
.exp-head .sec-label::before { display:none; }
.exp-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1280px;margin:0 auto; }
.exp-card { background:var(--cream);padding:44px 32px;border-radius:4px;position:relative;overflow:hidden;border-bottom:2px solid transparent;transition:transform .4s,border-color .4s,box-shadow .4s; }
.exp-card:hover { transform:translateY(-6px);border-bottom-color:var(--forest);box-shadow:0 20px 60px rgba(42,84,57,.08); }
.exp-icon-wrap { width:56px;height:56px;background:var(--forest-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:28px; }
.exp-icon { font-size:24px; }
.exp-n { position:absolute;top:20px;right:22px;font-size:11px;color:var(--stone);opacity:.4;letter-spacing:.08em; }
.exp-card h3 { font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:400;margin-bottom:14px; }
.exp-card p { font-size:14px;line-height:1.85;color:var(--text-light); }

#philosophy { background:var(--text);color:var(--cream);padding:110px 64px;text-align:center;position:relative;overflow:hidden; }
#philosophy::before { content:"तुरीय";font-family:"Cormorant Garamond",serif;font-size:280px;font-weight:300;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.025);pointer-events:none;white-space:nowrap; }
#philosophy .sec-label { color:rgba(244,240,234,.45);justify-content:center; }
#philosophy .sec-label::before { background:rgba(244,240,234,.3); }
#philosophy .sec-h2 { color:var(--cream); }
.phil-body { font-family:"Cormorant Garamond",serif;font-size:clamp(20px,2.5vw,32px);font-weight:300;font-style:italic;line-height:1.65;max-width:820px;margin:0 auto 64px;opacity:.88; }
.phil-values { display:flex;justify-content:center;gap:52px;flex-wrap:wrap;border-top:1px solid rgba(244,240,234,.1);padding-top:48px; }
.phil-val { text-align:center; }
.val-dot { width:5px;height:5px;background:var(--gold);border-radius:50%;margin:0 auto 10px; }
.phil-val span { font-size:10px;letter-spacing:.25em;text-transform:uppercase;opacity:.5; }

#treks { background:var(--cream);padding:120px 64px; }
.treks-top { max-width:1280px;margin:0 auto 60px;display:flex;justify-content:space-between;align-items:flex-end; }
.trek-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:1280px;margin:0 auto; }
.trek-card { background:var(--white);border-radius:4px;overflow:hidden;border:1px solid rgba(42,84,57,.09);transition:transform .4s,box-shadow .4s; }
.trek-card:hover { transform:translateY(-4px);box-shadow:0 24px 64px rgba(42,84,57,.1); }
.trek-vis { height:200px;position:relative;overflow:hidden;display:flex;align-items:flex-end; }
.trek-vis img { width:100%;height:100%;object-fit:cover;transition:transform .5s ease; }
.trek-card:hover .trek-vis img { transform:scale(1.08); }
.trek-badge { position:absolute;top:16px;left:16px;background:var(--forest);color:var(--cream);font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:4px 12px;border-radius:20px;z-index:2; }
.trek-body { padding:32px; }
.trek-body h3 { font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:400;margin-bottom:6px; }
.trek-loc { font-size:11px;letter-spacing:.1em;color:var(--stone);text-transform:uppercase;margin-bottom:14px; }
.trek-body p { font-size:14px;line-height:1.85;color:var(--text-light);margin-bottom:24px; }
.trek-meta { display:flex;gap:20px;padding-top:18px;border-top:1px solid rgba(0,0,0,.06); }
.tm { display:flex;flex-direction:column;gap:3px; }
.tm-l { font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone); }
.tm-v { font-size:13px;color:var(--text);font-weight:400; }

#for-whom { background:var(--white);padding:120px 64px; }
.fw-wrap { max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:80px; }
.fw-col h3 { font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:400;margin-bottom:28px; }
.fw-col ul { list-style:none; }
.fw-col li { padding:13px 0;font-size:15px;color:var(--text-light);border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:14px; }
.fw-yes li::before { content:"·";color:var(--forest);font-size:20px;font-weight:500; }
.fw-no li::before { content:"×";color:var(--stone);font-size:14px; }
.fw-note { margin-top:28px;font-size:13px;color:var(--stone);font-style:italic;line-height:1.8; }

#guides { background:var(--forest);color:var(--cream);padding:100px 64px;text-align:center; }
#guides .sec-label { color:rgba(244,240,234,.45);justify-content:center; }
#guides .sec-label::before { background:rgba(244,240,234,.3); }
#guides .sec-h2 { color:var(--cream); }
.guides-body { max-width:680px;margin:0 auto;font-size:17px;line-height:1.9;opacity:.78; }
.guide-tags { display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:40px; }
.guide-tag { padding:7px 18px;border:1px solid rgba(244,240,234,.2);border-radius:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65; }

#oath { background:var(--cream);padding:120px 64px;text-align:center; }
.oath-box { max-width:760px;margin:0 auto;background:var(--white);padding:64px 72px;border-radius:4px;border-left:3px solid var(--forest);position:relative; }
.oath-box::before { content:"The Turiya Oath";font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--forest);opacity:.6;position:absolute;top:24px;left:36px; }
.oath-lines { list-style:none;margin-top:12px; }
.oath-lines li { font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:300;font-style:italic;line-height:1.65;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.05);color:var(--text); }
.oath-lines li:last-child { border-bottom:none; }

#join { background:#1a2e1e;color:var(--cream);padding:120px 64px;text-align:center;position:relative;overflow:hidden; }
#join::before { content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(42,84,57,.6) 0%,transparent 70%); }
#join > * { position:relative;z-index:1; }
#join .sec-label { color:rgba(244,240,234,.4);justify-content:center; }
#join .sec-label::before { background:rgba(244,240,234,.25); }
.join-h { font-family:"Cormorant Garamond",serif;font-size:clamp(38px,5vw,70px);font-weight:300;line-height:1.15;margin-bottom:24px;color:var(--cream); }
.join-h em { font-style:italic;color:var(--gold-light); }
.join-sub { max-width:480px;margin:0 auto 48px;font-size:15px;line-height:1.9;opacity:.65; }
.join-form { display:flex;max-width:480px;margin:0 auto 20px;border:1px solid rgba(244,240,234,.18);border-radius:2px;overflow:hidden; }
.join-form input { flex:1;background:rgba(255,255,255,.06);border:none;outline:none;padding:17px 22px;color:var(--cream);font-family:"Outfit",sans-serif;font-size:14px;font-weight:300; }
.join-form input::placeholder { color:rgba(244,240,234,.3); }
.join-form button { padding:17px 28px;background:var(--gold);border:none;color:var(--white);font-family:"Outfit",sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:none;transition:background .3s;font-weight:400; }
.join-form button:hover { background:var(--gold-light); }
.join-note { font-size:11px;opacity:.35;letter-spacing:.05em; }

footer { background:var(--text);color:var(--cream);padding:72px 64px 40px; }
.footer-grid { display:grid;grid-template-columns:2fr 1fr 1fr;gap:72px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:28px; }
.footer-logo { filter:brightness(0) invert(1);opacity:.65;height:40px;margin-bottom:18px;display:block; }
.footer-brand p { font-size:13px;line-height:1.85;opacity:.35;max-width:280px; }
.footer-col h4 { font-size:9px;letter-spacing:.25em;text-transform:uppercase;opacity:.4;margin-bottom:18px; }
.footer-col ul { list-style:none; }
.footer-col li a { font-size:13px;color:var(--cream);opacity:.45;text-decoration:none;display:block;padding:6px 0;transition:opacity .3s; }
.footer-col li a:hover { opacity:1; }
.footer-bottom { display:flex;justify-content:space-between;font-size:11px;opacity:.25; }

@keyframes fadeUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
@keyframes spinSlow { to{transform:rotate(360deg)} }
@keyframes scanRight { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.reveal { opacity:0;transform:translateY(32px);transition:opacity .9s ease,transform .9s ease; }
.reveal.vis { opacity:1;transform:translateY(0); }

@media(max-width:900px){
  nav,nav.scrolled{padding:16px 24px;}
  .nav-links{display:none;}
  #hero{grid-template-columns:1fr;padding:100px 24px 60px;text-align:center;}
  .hero-left{padding-right:0;}
  .hero-right{margin-top:48px;}
  .hero-logo-ring{width:280px;height:280px;}
  .hero-logo-ring::before{width:320px;height:320px;}
  .hero-logo-ring img{width:160px;}
  .hero-ctas{justify-content:center;}
  #stats{padding:24px;flex-wrap:wrap;gap:24px;}
  #about,#experiences,#treks,#for-whom,#guides,#oath,#join{padding:80px 24px;}
  .about-wrap,.fw-wrap{grid-template-columns:1fr;gap:40px;}
  .exp-grid{grid-template-columns:1fr 1fr;}
  .trek-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr;gap:36px;}
  .treks-top{flex-direction:column;align-items:flex-start;gap:20px;}
  .oath-box{padding:48px 28px;}
  .join-form{flex-direction:column;}
}

/* UPCOMING STRIP */
.upcoming-strip { max-width:860px;margin:0 auto 56px;background:rgba(255,255,255,.06);border:1px solid rgba(244,240,234,.12);border-radius:4px;padding:40px; }
.upcoming-label { font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,240,234,.4);margin-bottom:28px; }
.upcoming-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:24px; }
.upcoming-item { display:flex;flex-direction:column;gap:6px;padding:24px;background:rgba(255,255,255,.04);border-radius:3px;border:1px solid rgba(244,240,234,.08);transition:border-color .3s; }
.upcoming-item:hover { border-color:rgba(244,240,234,.2); }
.upcoming-date { font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light);opacity:.8; }
.upcoming-name { font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:400;color:var(--cream); }
.upcoming-detail { font-size:12px;color:rgba(244,240,234,.5); }
.upcoming-seats { font-size:11px;color:var(--gold-light);margin-top:4px; }

/* CTA WRAP */
.cta-wrap { display:flex;gap:16px;justify-content:center;margin-bottom:48px;flex-wrap:wrap; }
.btn-book { display:inline-flex;align-items:center;gap:10px;padding:16px 40px;background:#25D366;color:white;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-radius:2px;font-family:"Outfit",sans-serif;font-weight:400;transition:background .3s,transform .2s; }
.btn-book:hover { background:#1db954;transform:translateY(-2px); }
.btn-enquire { display:inline-flex;align-items:center;padding:16px 40px;border:1px solid rgba(244,240,234,.25);color:var(--cream);font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-radius:2px;font-family:"Outfit",sans-serif;font-weight:300;transition:border-color .3s; }
.btn-enquire:hover { border-color:rgba(244,240,234,.6); }

/* COMMUNITY STRIP */
.community-strip { border-top:1px solid rgba(244,240,234,.08);padding-top:48px;text-align:center; }
.community-text { font-size:14px;opacity:.5;margin-bottom:20px; }
.btn-community { display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:1px solid rgba(37,211,102,.3);color:rgba(37,211,102,.8);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-radius:2px;font-family:"Outfit",sans-serif;transition:all .3s;margin-bottom:20px; }
.btn-community:hover { border-color:rgba(37,211,102,.7);color:#25D366; }

/* TREK BOOK BUTTON */
.trek-book-btn { display:block;margin:16px 0 4px;padding:12px;background:var(--forest);color:var(--cream);text-align:center;text-decoration:none;font-size:11px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px;font-family:"Outfit",sans-serif;transition:background .3s; }
.trek-book-btn:hover { background:#1a3d28; }

/* FLOATING WHATSAPP */
.wa-float { position:fixed;bottom:32px;right:32px;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1000;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:transform .3s,box-shadow .3s;text-decoration:none; }
.wa-float:hover { transform:scale(1.1);box-shadow:0 8px 32px rgba(37,211,102,.5); }

@media(max-width:900px){
  .upcoming-grid{grid-template-columns:1fr;}
  .cta-wrap{flex-direction:column;align-items:center;}
  .btn-book,.btn-enquire{width:100%;max-width:320px;justify-content:center;}
  .wa-float{bottom:24px;right:24px;width:48px;height:48px;}
}

/* WALKING QUESTIONS */
.walking-question { background:var(--forest);padding:72px 64px;text-align:center;position:relative;overflow:hidden; }
.walking-question::before { content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 100% at 50% 50%,rgba(255,255,255,.04) 0%,transparent 70%); }
.wq-text { font-family:"Cormorant Garamond",serif;font-size:clamp(24px,3.5vw,48px);font-weight:300;font-style:italic;color:var(--cream);opacity:.92;position:relative;z-index:1;max-width:900px;margin:0 auto;line-height:1.4; }

/* EXP LEARN LINK */
.exp-learn { display:inline-block;margin-top:20px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--forest);text-decoration:none;border-bottom:1px solid rgba(42,84,57,.3);padding-bottom:2px;transition:border-color .3s,opacity .3s; }
.exp-learn:hover { border-color:var(--forest);opacity:.7; }

@media(max-width:900px){
  .walking-question{padding:56px 24px;}
  .hero-logo-ring{width:300px;height:300px;}
  .hero-logo-ring::before{width:350px;height:350px;}
  .hero-logo-ring img{width:200px;}
}
</style>
</head>
<body>
<div id="cur"></div>
